# Production overrides — activate with SPRING_PROFILES_ACTIVE=prod.
# All secrets/DB/CORS/mail values still come from environment variables (see application.properties);
# this file only flips dev conveniences to production-safe defaults.

# Serve cached templates.
spring.thymeleaf.cache=true

# HttpOnly session cookie must be Secure behind HTTPS (override with COOKIE_SECURE=false only for HTTP staging).
app.cookie.secure=${COOKIE_SECURE:true}

# Behind the Caddy TLS reverse proxy: honour X-Forwarded-* so the app sees the external https scheme/host
# (correct request.isSecure(), redirect/Location URLs, and the Swagger server URL).
server.forward-headers-strategy=framework

# Trim runtime footprint / avoid leaking SQL.
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Only health/info are exposed publicly (readiness/liveness probes enabled in base config).
management.endpoints.web.exposure.include=health,info

# DB migrations — prod is Flyway-managed. Flyway runs V1__baseline_schema.sql (db/migration) before
# Hibernate, then Hibernate only VALIDATES the schema (never mutates it).
#   - Fresh DB:            Flyway applies V1 (and any later V2+).
#   - Existing (ddl-auto): baseline-on-migrate marks it at V1 (skips V1) and applies only V2+.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
