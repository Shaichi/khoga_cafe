# Production overrides — activate with SPRING_PROFILES_ACTIVE=prod.
# All secrets/DB/CORS/mail values still come from environment variables (see application.properties);
# this file only flips dev conveniences to production-safe defaults.

# Serve cached templates.
spring.thymeleaf.cache=true

# HttpOnly session cookie must be Secure behind HTTPS (override with COOKIE_SECURE=false only for HTTP staging).
app.cookie.secure=${COOKIE_SECURE:true}

# Trim runtime footprint / avoid leaking SQL.
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Only health/info are exposed publicly (readiness/liveness probes enabled in base config).
management.endpoints.web.exposure.include=health,info

# NOTE: production should adopt a migration tool (Flyway — plan P2) and then set JPA_DDL_AUTO=validate.
# Until then the schema stays entity-driven via JPA_DDL_AUTO (default "update").
