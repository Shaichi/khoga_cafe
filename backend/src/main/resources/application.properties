# Đổi port nếu cổng 8080 trùng với app khác
server.port=${SERVER_PORT:8080}

# Cấu hình SQL Server — mọi giá trị nhạy cảm lấy từ biến môi trường (mặc định = dev local).
spring.datasource.url=${DB_URL:jdbc:sqlserver://127.0.0.1:1433;databaseName=khoga_coffee_shop;encrypt=false;trustServerCertificate=true;}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:Khoga@Strong#2026}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# DB migrations (Flyway) — OFF by default so dev/test stay entity-driven via ddl-auto above (tests
# unchanged). Prod turns this ON and switches ddl-auto to validate (application-prod.properties).
spring.flyway.enabled=${FLYWAY_ENABLED:false}

# Tắt cache Thymeleaf để code giao diện nhanh hơn (prod bật lại qua profile)
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# i18n (P4) — message bundle for API/error messages. Default locale is Vietnamese (messages.properties);
# Accept-Language: en switches to messages_en.properties. UTF-8 for Vietnamese diacritics.
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# Actuator — chỉ expose health/info cho load balancer & Docker healthcheck.
management.endpoints.web.exposure.include=${ACTUATOR_EXPOSE:health,info}
management.endpoint.health.probes.enabled=true

# JWT — secret mặc định CHỈ dùng cho dev; production BẮT BUỘC đặt JWT_SECRET (>= 32 byte cho HS256).
app.jwt.secret=${JWT_SECRET:khoga-dev-secret-please-change-in-production-0123456789abcdef}
app.jwt.expiration-hq-minutes=${JWT_EXP_HQ_MINUTES:120}
app.jwt.expiration-branch-minutes=${JWT_EXP_BRANCH_MINUTES:480}

# Session cookie — đặt COOKIE_SECURE=true khi chạy sau HTTPS ở production.
app.cookie.secure=${COOKIE_SECURE:false}

# CORS — danh sách origin cho FE (phân tách bởi dấu phẩy); production đặt CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081,http://localhost:*,http://127.0.0.1:*}

# Mail (SMTP) — thông tin đăng nhập lấy từ biến môi trường.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=tmihieuytb@gmail.com
spring.mail.password=etozbzohfmyycutn
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# VietQR gateway — khóa/tài khoản lấy từ biến môi trường (mặc định rỗng → dùng QR fallback ở dev).
app.vietqr.webhook-secret=${VIETQR_WEBHOOK_SECRET:dev-webhook-secret}
app.vietqr.client-id=${VIETQR_CLIENT_ID:}
app.vietqr.api-key=${VIETQR_API_KEY:}
app.vietqr.bank-id=${VIETQR_BANK_ID:970415}
app.vietqr.account-no=${VIETQR_ACCOUNT_NO:113366668888}
app.vietqr.account-name=${VIETQR_ACCOUNT_NAME:KHOGA CAFE}
