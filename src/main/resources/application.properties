# Đổi port nếu cổng 8080 trùng với app khác
server.port=8080

# Cấu hình SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=khoga_coffee_shop;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=update

# Tắt cache Thymeleaf để code giao diện nhanh hơn
spring.thymeleaf.cache=false

# JWT (P0.1) — secret CHỈ dùng cho dev; production phải đổi & lấy từ biến môi trường.
# HS256 yêu cầu secret >= 32 byte.
app.jwt.secret=khoga-dev-secret-please-change-in-production-0123456789abcdef
app.jwt.expiration-hq-minutes=120
app.jwt.expiration-branch-minutes=480
