name: khoga

# Full stack: SQL Server + Spring Boot API + React web admin (nginx).
# Secrets come from the environment / .env (see .env.example). Never commit real secrets.
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-Khoga@Strong#2026}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # One-shot: create the database Hibernate then populates (JDBC can't CREATE DATABASE).
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-Khoga@Strong#2026}
    entrypoint: /bin/bash
    command:
      - -c
      - >
        /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$$MSSQL_SA_PASSWORD" -C
        -Q "IF DB_ID('khoga_coffee_shop') IS NULL CREATE DATABASE khoga_coffee_shop"
    restart: "no"

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: "jdbc:sqlserver://db:1433;databaseName=khoga_coffee_shop;encrypt=true;trustServerCertificate=true;"
      DB_USERNAME: sa
      DB_PASSWORD: ${DB_PASSWORD:-Khoga@Strong#2026}
      JWT_SECRET: ${JWT_SECRET:-please-change-this-to-a-32byte-min-secret-0123456789}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_USERNAME: ${MAIL_USERNAME:-noreply@khoga.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-dummy_password}
      VIETQR_WEBHOOK_SECRET: ${VIETQR_WEBHOOK_SECRET:-dev-webhook-secret}
    ports:
      - "8080:8080"

  web:
    build: ./khoga_web_admin
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  mssql-data:
